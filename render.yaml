# Hospedagem no Render (https://render.com): New > Blueprint > selecione este repositório.
services:
  - type: web
    name: controle-rotina
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    healthCheckPath: /saude
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: PROXY_FIX
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: controle-rotina-db
          property: connectionString

databases:
  - name: controle-rotina-db
    plan: basic-256mb
