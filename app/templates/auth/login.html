{% extends "auth/_layout.html" %}
{% block title %}Entrar{% endblock %}
{% block cartao %}
<h1 class="h4 mb-3">Entrar</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3"><label class="form-label">E-mail</label><input type="email" class="form-control" name="email" value="{{ email }}" required autofocus autocomplete="username"></div>
  <div class="mb-3"><label class="form-label">Senha</label><input type="password" class="form-control" name="senha" required autocomplete="current-password"></div>
  <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="lembrar" id="lembrar"><label class="form-check-label" for="lembrar">Manter conectado neste computador</label></div>
  <button class="btn btn-primary w-100">Entrar</button>
</form>
<p class="small text-muted mt-3 mb-0">Esqueceu a senha? Peça a um administrador para redefini-la.</p>
{% endblock %}
