name: Testes e publicação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # botão "Run workflow" para publicar manualmente (envia todos os arquivos)

concurrency:
  group: publicacao-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  publicar:
    needs: testes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Publicar no PythonAnywhere
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PA_HOST: ${{ vars.PA_HOST }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: python deploy/pythonanywhere_deploy.py
